<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/agenda-order.css" />
    <link rel="stylesheet" href="/sitewide-type.css" />
    <link rel="stylesheet" href="/dynasty-pulse.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02070b" />
    <meta name="description" content="Track the complete Road to Glory journey from high-school recruit to college player and head coach." />
    <title>Dynasty HQ | Command Center</title>
  </head>
  <body>
    <div id="root"></div>

    <div id="dynasty-pulse-static" aria-label="Dynasty Pulse">
      <div class="dhq-pulse-card">
        <span class="dhq-pulse-live"><span class="dhq-pulse-dot"></span>LIVE</span>
        <span id="dynasty-pulse-season" class="dhq-pulse-context">S1 · W1</span>
        <span id="dynasty-pulse-summary" class="dhq-pulse-context dhq-pulse-summary">3★ QB · 63 OVR</span>
        <span class="dhq-pulse-metric"><span id="dynasty-pulse-metric-label">TAPE</span><strong id="dynasty-pulse-metric-value">0</strong></span>
      </div>
      <div id="dynasty-pulse-avatar" class="dhq-pulse-avatar" title="Player profile">BW</div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
    <script src="/dynasty-pulse.js" defer></script>
  </body>
</html>
