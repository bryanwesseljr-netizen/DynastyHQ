  @media(max-width:700px){
    #app{display:block}
    .desktop-stage{display:none}
    .mobile-stage{display:block}
    .prototype-page{min-height:100vh}
  }
  @media(min-width:701px){
    body{padding:10px 0 22px}
  }

<script>
(() => {
  const pages = [...document.querySelectorAll('.prototype-page')];
  const valid = new Set(['home','gamehub','newsroom']);

  function routeFromHash() {
    const raw = location.hash.replace('#','').toLowerCase();
    return valid.has(raw) ? raw : 'home';
  }

  function show(page, push = false) {
    if (!valid.has(page)) page = 'home';
    pages.forEach(el => {
      const active = el.dataset.page === page;
      el.classList.toggle('is-active', active);
      el.setAttribute('aria-hidden', active ? 'false' : 'true');
    });
    if (push && location.hash !== '#' + page) location.hash = page;
    document.title = 'DynastyHQ — ' + (page === 'gamehub' ? 'Game Hub' : page[0].toUpperCase()+page.slice(1)) + ' Preview';
    window.scrollTo({top:0,left:0,behavior:'instant'});
  }

  document.addEventListener('click', e => {
    const hit = e.target.closest('[data-target]');
    if (!hit) return;
    e.preventDefault();
    show(hit.dataset.target, true);
  });

  window.addEventListener('hashchange', () => show(routeFromHash(), false));
  show(routeFromHash(), false);
})();
</script>
