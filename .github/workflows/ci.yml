name: DynastyHQ CI

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: dynastyhq-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify regression suite and production build
        id: verify
        continue-on-error: true
        run: |
          npm ci --legacy-peer-deps
          npm test
          npm run build

      - name: Publish DynastyHQ CI status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'DynastyHQ CI',
              description: passed
                ? 'Regression tests and Vite build passed.'
                : 'Regression tests or Vite build failed.',
            });

      - name: Fail workflow when verification fails
        if: steps.verify.outcome != 'success'
        run: exit 1
