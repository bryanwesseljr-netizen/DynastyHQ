name: DynastyHQ CI

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: dynastyhq-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --legacy-peer-deps

      - name: Run critical journey smoke tests
        id: smoke
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:smoke 2>&1 | tee /tmp/dynastyhq-smoke-output.txt

      - name: Run domain regression tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:regression 2>&1 | tee /tmp/dynastyhq-test-output.txt

      - name: Build application
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Publish DynastyHQ CI statuses
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const install = '${{ steps.install.outcome }}';
            const smoke = '${{ steps.smoke.outcome }}';
            const tests = '${{ steps.tests.outcome }}';
            const build = '${{ steps.build.outcome }}';
            const firstFailure = (file) => {
              try {
                const output = fs.readFileSync(file, 'utf8');
                const lines = output.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
                return lines.find((line) => /^not ok\b/i.test(line))
                  || lines.find((line) => /AssertionError|ERR_ASSERTION|Error:/i.test(line))
                  || '';
              } catch {
                return '';
              }
            };
            const smokeFailureName = firstFailure('/tmp/dynastyhq-smoke-output.txt');
            const failureName = firstFailure('/tmp/dynastyhq-test-output.txt');
            const clip = (value, max = 140) => String(value).slice(0, max);
            const publishStatus = async (statusContext, outcome, successText, failureText) => {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: outcome === 'success' ? 'success' : 'failure',
                context: clip(statusContext, 100),
                description: clip(outcome === 'success' ? successText : failureText),
              });
            };
            await publishStatus('DynastyHQ Install', install, 'Dependencies installed.', `Dependency install: ${install}.`);
            const smokeContext = smoke === 'success'
              ? 'DynastyHQ Smoke'
              : `DynastyHQ Smoke · ${smokeFailureName || smoke}`;
            await publishStatus(smokeContext, smoke, 'Critical user journeys passed.', smokeFailureName || `Critical journey smoke tests: ${smoke}.`);
            const testContext = tests === 'success'
              ? 'DynastyHQ Tests'
              : `DynastyHQ Tests · ${failureName || tests}`;
            await publishStatus(testContext, tests, 'Domain regression tests passed.', failureName || `Domain tests: ${tests}.`);
            await publishStatus('DynastyHQ Build', build, 'Vite build passed.', `Vite build: ${build}.`);
            const passed = install === 'success' && smoke === 'success' && tests === 'success' && build === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'DynastyHQ CI',
              description: clip(passed
                ? 'Install, smoke tests, regression tests, and Vite build passed.'
                : `install=${install}, smoke=${smoke}, tests=${tests}, build=${build}; ${smokeFailureName || failureName}`),
            });

      - name: Fail workflow when verification fails
        if: steps.install.outcome != 'success' || steps.smoke.outcome != 'success' || steps.tests.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
