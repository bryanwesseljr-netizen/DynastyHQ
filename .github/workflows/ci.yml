name: DynastyHQ CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dynastyhq-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run domain regression tests
        run: npm test

      - name: Build application
        run: npm run build
