name: DynastyHQ CI

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: dynastyhq-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --legacy-peer-deps

      - name: Run domain regression tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Build application
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Publish DynastyHQ CI statuses
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const install = '${{ steps.install.outcome }}';
            const tests = '${{ steps.tests.outcome }}';
            const build = '${{ steps.build.outcome }}';
            const publishStatus = async (statusContext, outcome, successText, failureText) => {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: outcome === 'success' ? 'success' : 'failure',
                context: statusContext,
                description: outcome === 'success' ? successText : failureText,
              });
            };
            await publishStatus('DynastyHQ Install', install, 'Dependencies installed.', `Dependency install: ${install}.`);
            await publishStatus('DynastyHQ Tests', tests, 'Domain regression tests passed.', `Domain tests: ${tests}.`);
            await publishStatus('DynastyHQ Build', build, 'Vite build passed.', `Vite build: ${build}.`);
            const passed = install === 'success' && tests === 'success' && build === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'DynastyHQ CI',
              description: passed
                ? 'Install, regression tests, and Vite build passed.'
                : `install=${install}, tests=${tests}, build=${build}`,
            });

      - name: Fail workflow when verification fails
        if: steps.install.outcome != 'success' || steps.tests.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
